packages:
  - api
  - web

verifyDepsBeforeRun: false

overrides:
  "@sentry/node": 10.76.2
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/instrumentation": 0.220.0
  "@opentelemetry/sdk-trace-base": 2.12.0

onlyBuiltDependencies:
  - mongodb-memory-server
  - esbuild
  - unrs-resolver
  - "@tailwindcss/oxide"
  - sharp

ignoredBuiltDependencies:
  - "@apollo/protobufjs"
  - "@google/genai"
  - aws-sdk
  - msgpackr-extract
  - protobufjs

allowBuilds:
  '@apollo/protobufjs': false
  '@google/genai': false
  aws-sdk: false
  esbuild: true
  mongodb-memory-server: true
  msgpackr-extract: false
  protobufjs: false
  unrs-resolver: true
